name: Auto-update TripAdvisor Reviews

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:          # Also allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch latest reviews
        run: python scripts/fetch_reviews.py

      - name: Commit & push if reviews changed
        run: |
          git config user.name  "Odessy Reviews Bot"
          git config user.email "noreply@odessytravel.com"
          git add reviews.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update TripAdvisor reviews [skip ci]"
            git push
          fi
